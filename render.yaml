# Render Blueprint Configuration for CodeGraphAI
# https://render.com/docs/blueprint-spec

services:
  # --------------------------------------------------
  # 1. Frontend: React/Vite Static Site
  # --------------------------------------------------
  - type: web
    name: codegraphai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: codegraphai-backend
          property: host
          envVarKey: RENDER_EXTERNAL_URL

  # --------------------------------------------------
  # 2. Backend: FastAPI Web Service
  # --------------------------------------------------
  - type: web
    name: codegraphai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codegraphai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: codegraphai-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: COLLECTION_NAME
        value: repo_chunks
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true

  # --------------------------------------------------
  # 3. Celery Ingestion Worker: Background Worker
  # --------------------------------------------------
  - type: worker
    name: codegraphai-celery-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.workers.celery_app.celery worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codegraphai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: codegraphai-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: COLLECTION_NAME
        value: repo_chunks
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false

  # --------------------------------------------------
  # 4. Managed Redis Instance
  # --------------------------------------------------
  - type: redis
    name: codegraphai-redis
    ipAllowList: []
    plan: free

# ----------------------------------------------------
# 5. Managed PostgreSQL Database
# ----------------------------------------------------
databases:
  - name: codegraphai-db
    databaseName: codegraph_db
    user: codegraph
    plan: free

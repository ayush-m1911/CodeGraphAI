# Render Blueprint Configuration for CodeGraphAI (100% Free Tier)
# https://render.com/docs/blueprint-spec

services:
  # --------------------------------------------------
  # 1. Frontend: React/Vite Static Site (100% Free Forever)
  # --------------------------------------------------
  - type: web
    name: codegraphai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: codegraphai-backend
          property: host

  # --------------------------------------------------
  # 2. Backend: FastAPI + Celery Worker (Free Tier Web Service)
  # --------------------------------------------------
  - type: web
    name: codegraphai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codegraphai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: codegraphai-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: COLLECTION_NAME
        value: repo_chunks
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true

  # --------------------------------------------------
  # 3. Redis Instance (Free Tier)
  # --------------------------------------------------
  - type: redis
    name: codegraphai-redis
    plan: free
    ipAllowList: []

# ----------------------------------------------------
# 4. PostgreSQL Database (Free Tier)
# ----------------------------------------------------
databases:
  - name: codegraphai-db
    databaseName: codegraph_db
    user: codegraph
    plan: free
